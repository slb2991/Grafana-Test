---

#------------------------------------------------------------------------------
# YAML Aliases to simplify maintenance

anchorLinks:
  - link: &grafana-home
      url: "https://grafana.com/"
      params: "time"
  - thresholds: &thresholds-slow
      - {color: "red", level: 0}
      - {color: "green", level: .1}
  - thresholds: &thresholds-fast
      - {color: "green", level: 0}
      - {color: "orange", level: 200}
      - {color: "red", level: 600}
  - flowAnimation: &flowanim-slow
      thresholdOffValue: 2
      thresholdLwrValue: 10
      thresholdLwrDurationSecs: 1
      thresholdUprValue: 100
      thresholdUprDurationSecs: 0.1
  - flowAnimation: &flowanim-sys
      thresholdOffValue: 1
      thresholdLwrValue: 1
      thresholdLwrDurationSecs: 1
      thresholdUprValue: 100
      thresholdUprDurationSecs: 0.1
      unidirectional: false
  - flowAnimation: &flowanim-fast
      thresholdOffValue: 10
      thresholdLwrValue: 100
      thresholdLwrDurationSecs: 1
      thresholdUprValue: 600
      thresholdUprDurationSecs: 0.1

#------------------------------------------------------------------------------
# Panel Config

cellIdPreamble: "cell-"
gradientMode: "hue"
tagConfig:
  condensed: false
cells: 

  Sensors:
    dataRef: "test-data-small-sin"
    label:
      separator: "cr"
    labelColor:
      thresholds: *thresholds-slow
   
  S_N:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys

  N-DC:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys
  
  DC:
     dataRef: "test-data-small-sin"
     label:
       separator: "cr"
     labelColor:
       thresholds: *thresholds-slow

  DC-P1:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys

  DC-P2:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys

  P-DB:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys

  DB:
     dataRef: "test-data-small-sin"
     label:
       separator: "cr"
     labelColor:
       thresholds: *thresholds-slow

  P:
     dataRef: "test-data-small-sin"
     label:
       separator: "cr"
       unitsPostfix: "Topic"
     labelColor:
       thresholds: *thresholds-slow

  E:
     dataRef: "test-data-small-sin"
     label:
       separator: "cr"
     labelColor:
       thresholds: *thresholds-slow

  P-E:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys

  E-S3:
    dataRef: "test-data-small-sin"
    flowAnimation: *flowanim-sys

  S3:
     dataRef: "test-data-small-sin"
     label:
       separator: "cr"
       unitsPostfix: "GB"
     labelColor:
       thresholds: *thresholds-slow
